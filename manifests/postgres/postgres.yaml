# Source: postgres/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: postgres
---
# Source: postgres/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: ILMIYA_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ILMIYA_USER
            - name: ILMIYA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ILMIYA_PASSWORD
            - name: ILMIYA_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: ILMIYA_DB
            - name: UWATI_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: UWATI_USER
            - name: UWATI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: UWATI_PASSWORD
            - name: UWATI_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: UWATI_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -h 127.0.0.1 -p 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -h 127.0.0.1 -p 5432
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data

apiVersion: batch/v1
kind: CronJob
metadata:
  name: woodpecker-storage-cleanup
  namespace: default
  labels:
    app.kubernetes.io/name: woodpecker-storage-cleanup
    app.kubernetes.io/part-of: platform-tooling
spec:
  schedule: "0 2 * * *"  # Runs daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: woodpecker-storage-cleanup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: storage-cleaner
              image: docker.io/curlimages/curl:8.23.0
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: WOODPECKER_URL
                  value: "http://woodpecker-server.default.svc.cluster.local:8000"
                - name: MAX_BUILDS_TO_KEEP
                  value: "10"
                - name: DAYS_TO_KEEP
                  value: "2"
              volumeMounts:
                - name: podman-sock
                  mountPath: /var/run/docker.sock
              command:
                - "/bin/sh"
                - "-c"
                - |
                  set -e
                  echo "=================================================================="
                  echo " Starting Scheduled Autonomous Kubernetes Storage Cleaner"
                  echo " Date: $(date)"
                  echo "=================================================================="

                  # 1. Prune Host/Engine Dangling & Unused Images via Socket
                  if [ -S /var/run/docker.sock ]; then
                    echo "==> [1/3] Pruning container runtime unused images..."
                    curl -s -X POST --unix-socket /var/run/docker.sock "http://localhost/v1.41/images/prune?filters=%7B%22dangling%22%3A%5B%22true%22%5D%7D" || true

                    echo "==> [2/3] Pruning unattached storage volumes..."
                    curl -s -X POST --unix-socket /var/run/docker.sock "http://localhost/v1.41/volumes/prune" || true

                    echo "==> [3/3] Pruning stopped containers..."
                    curl -s -X POST --unix-socket /var/run/docker.sock "http://localhost/v1.41/containers/prune" || true
                  else
                    echo "Notice: /var/run/docker.sock not available, skipping socket cleanup."
                  fi

                  echo "=================================================================="
                  echo " Storage cleanup completed successfully."
                  echo "=================================================================="
          volumes:
            - name: podman-sock
              hostPath:
                path: /run/podman/podman.sock

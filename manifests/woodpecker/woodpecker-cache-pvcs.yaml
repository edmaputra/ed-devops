apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woodpecker-gradle-cache
  namespace: default
  labels:
    app.kubernetes.io/part-of: woodpecker
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---

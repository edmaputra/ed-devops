apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: default
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/edmaputra/ed-devops.git
    targetRevision: HEAD
    path: manifests/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---

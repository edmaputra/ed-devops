apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: default
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/edmaputra/ed-devops.git
    targetRevision: HEAD
    path: manifests/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ilmiya-backend
  namespace: default
  annotations:
    argocd.image-updater.argoproj.io/image-list: backend=k3d-dev-registry:5000/ilmiya-backend
    argocd.image-updater.argoproj.io/backend.update-strategy: latest
    argocd.image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/edmaputra/ed-devops.git
    targetRevision: HEAD
    path: manifests/apps/ilmiya-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ilmiya-frontend
  namespace: default
  annotations:
    argocd.image-updater.argoproj.io/image-list: frontend=k3d-dev-registry:5000/ilmiya-frontend
    argocd.image-updater.argoproj.io/frontend.update-strategy: latest
    argocd.image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/edmaputra/ed-devops.git
    targetRevision: HEAD
    path: manifests/apps/ilmiya-frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

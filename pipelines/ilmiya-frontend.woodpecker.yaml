when:
  - event: [push, pull_request, manual]
    branch: [main, master]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      remote: http://gitea-http.default.svc.cluster.local:3000/gitea_admin/ilmiya-frontend.git
      recursive: true
      submodule-override:
        .agents: https://github.com/edmaputra/ed-agent-standards.git

steps:
  - name: build-flutter-web
    image: k3d-dev-registry:5000/flutter:stable
    volumes:
      - woodpecker-flutter-cache:/root/.pub-cache
    commands:
      - echo "==> Syncing latest code from GitHub main..."
      - git fetch https://github.com/edmaputra/ilmiya-frontend.git ${CI_COMMIT_BRANCH:-main}
      - git reset --hard FETCH_HEAD
      - git submodule update --init --recursive || true
      - 'echo "==> Building commit: $(git log -1 --oneline)"'
      - echo "==> Configuring Flutter Web..."
      - flutter config --no-analytics
      - flutter config --enable-web
      - echo "==> Resolving dependencies..."
      - flutter pub get
      - echo "==> Compiling Flutter Web release..."
      - flutter build web --release --no-wasm-dry-run --dart-define=ILMIYA_API_BASE_URL=https://ilmiya.localhost
      - echo "==> Verifying compiled web output..."
      - ls -la build/web/
      - 'test -f build/web/index.html || { echo "ERROR: build/web/index.html missing!"; exit 1; }'
      - rm -f .dockerignore
      - |
        cat <<'EOF' > Dockerfile.prod
        FROM nginx:alpine
        RUN rm -rf /usr/share/nginx/html/*
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY build/web /usr/share/nginx/html
        COPY docker-entrypoint.sh /docker-entrypoint.sh
        RUN chmod +x /docker-entrypoint.sh
        EXPOSE 80
        ENTRYPOINT ["/docker-entrypoint.sh"]
        CMD ["nginx", "-g", "daemon off;"]
        EOF
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2048Mi

  - name: build-and-push-kaniko
    image: k3d-dev-registry:5000/kaniko:debug
    commands:
      - echo "==> Building and pushing container image via Kaniko..."
      - |
        /kaniko/executor \
          --context=dir://. \
          --dockerfile=Dockerfile.prod \
          --destination=k3d-dev-registry:5000/ilmiya-frontend:${CI_PIPELINE_NUMBER:-1} \
          --destination=k3d-dev-registry:5000/ilmiya-frontend:latest \
          --cache=true --cache-run-layers=true \
          --cache-repo=k3d-dev-registry:5000/kaniko-cache --cache-ttl=72h --compressed-caching=false \
          --snapshot-mode=redo \
          --image-download-retry=3 \
          --image-fs-extract-retry=3 \
          --push-retry=3 \
          --insecure \
          --skip-tls-verify
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1024Mi

  - name: deploy-or-rollout
    image: k3d-dev-registry:5000/kubectl:latest
    commands:
      - echo "==> Checking if ilmiya-frontend is deployed in Kubernetes..."
      - |
        if ! kubectl get deployment ilmiya-frontend >/dev/null 2>&1; then
          echo "==> Deployment not found. Deploying application manifests from ed-devops..."
          git clone --depth 1 http://gitea-http.default.svc.cluster.local:3000/gitea_admin/ed-devops.git /tmp/ed-devops 2>/dev/null || \
          git clone --depth 1 https://github.com/edmaputra/ed-devops.git /tmp/ed-devops
          kubectl apply -k /tmp/ed-devops/manifests/apps/ilmiya-frontend
          rm -rf /tmp/ed-devops
          echo "[OK] Application manifests deployed."
        else
          echo "==> Deployment found. Triggering rollout restart for ilmiya-frontend..."
          kubectl rollout restart deployment/ilmiya-frontend
        fi
      - kubectl rollout status deployment/ilmiya-frontend --timeout=180s
      - echo "[OK] Deployment rollout succeeded."
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-deployer

image:
  repository: k3d-dev-registry:5000/fluent-bit
  tag: "latest"
  pullPolicy: IfNotPresent

# Enable daemonset for all nodes
kind: DaemonSet

# Resource tuning for local development lab (~30MB RAM per node)
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

# Volume mounts compatible with k3d/k3s in rootless container
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: FileOrCreate

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

# Pipeline configuration for OpenObserve ingestion (Cluster & Container Logs)
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        Refresh_Interval 10

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name http
        Match kube.*
        Host openobserve.default.svc.cluster.local
        Port 5080
        URI /api/default/k8s_logs/_json
        Format json
        json_date_key _timestamp
        json_date_format iso8601
        HTTP_User admin@example.com
        HTTP_Passwd DevOps_OpenObserve#2026
        compress gzip
        Retry_Limit 5

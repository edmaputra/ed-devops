apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fullnameOverride }}-initdb
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
data:
  01-init-app-databases.sh: |
    #!/bin/bash
    set -e

    echo "=== Initializing Application Databases and Users ==="

    # Provision Ilmiya
    if [ -n "$ILMIYA_USER" ] && [ -n "$ILMIYA_PASSWORD" ] && [ -n "$ILMIYA_DB" ]; then
      echo "Configuring Ilmiya database ($ILMIYA_DB) and user ($ILMIYA_USER)..."
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '$ILMIYA_USER') THEN
            CREATE ROLE "$ILMIYA_USER" WITH LOGIN PASSWORD '$ILMIYA_PASSWORD';
          ELSE
            ALTER ROLE "$ILMIYA_USER" WITH PASSWORD '$ILMIYA_PASSWORD';
          END IF;
        END
        \$\$;

        SELECT 'CREATE DATABASE "$ILMIYA_DB" OWNER "$ILMIYA_USER"'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$ILMIYA_DB')\gexec

        GRANT ALL PRIVILEGES ON DATABASE "$ILMIYA_DB" TO "$ILMIYA_USER";
    EOSQL

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$ILMIYA_DB" <<-EOSQL
        GRANT ALL ON SCHEMA public TO "$ILMIYA_USER";
        ALTER SCHEMA public OWNER TO "$ILMIYA_USER";
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    EOSQL
      echo "Ilmiya successfully configured."
    fi

    # Provision Uwati
    if [ -n "$UWATI_USER" ] && [ -n "$UWATI_PASSWORD" ] && [ -n "$UWATI_DB" ]; then
      echo "Configuring Uwati database ($UWATI_DB) and user ($UWATI_USER)..."
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '$UWATI_USER') THEN
            CREATE ROLE "$UWATI_USER" WITH LOGIN PASSWORD '$UWATI_PASSWORD';
          ELSE
            ALTER ROLE "$UWATI_USER" WITH PASSWORD '$UWATI_PASSWORD';
          END IF;
        END
        \$\$;

        SELECT 'CREATE DATABASE "$UWATI_DB" OWNER "$UWATI_USER"'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$UWATI_DB')\gexec

        GRANT ALL PRIVILEGES ON DATABASE "$UWATI_DB" TO "$UWATI_USER";
    EOSQL

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$UWATI_DB" <<-EOSQL
        GRANT ALL ON SCHEMA public TO "$UWATI_USER";
        ALTER SCHEMA public OWNER TO "$UWATI_USER";
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    EOSQL
      echo "Uwati successfully configured."
    fi

    echo "=== Application Databases Initialization Complete ==="

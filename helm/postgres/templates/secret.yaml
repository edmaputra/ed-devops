apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fullnameOverride }}-secret
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.auth.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  ILMIYA_DB: {{ .Values.auth.ilmiya.database | quote }}
  ILMIYA_USER: {{ .Values.auth.ilmiya.user | quote }}
  ILMIYA_PASSWORD: {{ .Values.auth.ilmiya.password | quote }}
  UWATI_DB: {{ .Values.auth.uwati.database | quote }}
  UWATI_USER: {{ .Values.auth.uwati.user | quote }}
  UWATI_PASSWORD: {{ .Values.auth.uwati.password | quote }}

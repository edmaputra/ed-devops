apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: 5432
  selector:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: 5432
  selector:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}

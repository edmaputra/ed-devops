apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}-http
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: 3000
      protocol: TCP
    - name: ssh
      port: {{ .Values.service.sshPort }}
      targetPort: 2222
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}

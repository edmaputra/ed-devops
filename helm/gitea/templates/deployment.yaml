apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride }}
  labels:
    app.kubernetes.io/name: {{ .Values.fullnameOverride }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.fullnameOverride }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.fullnameOverride }}
    spec:
      containers:
        - name: gitea
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: GITEA__server__DOMAIN
              value: {{ .Values.domain | quote }}
            - name: GITEA__server__ROOT_URL
              value: {{ .Values.rootUrl | quote }}
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__SSH_PORT
              value: "2222"
            - name: GITEA__server__SSH_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: GITEA__database__DB_TYPE
              value: "sqlite3"
            - name: GITEA__database__PATH
              value: "/data/gitea/gitea.db"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__SECRET_KEY
              value: "gitea-local-devops-lab-secret-key-2026"
            - name: GITEA__oauth2__ENABLED
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__service__ENABLE_CAPTCHA
              value: "false"
            - name: GITEA__openid__ENABLE_OPENID_SIGNIN
              value: "false"
            - name: GITEA__openid__ENABLE_OPENID_SIGNUP
              value: "false"
            - name: GITEA__security__ALLOWED_HOST_LIST
              value: "loopback,private,external"
            - name: GITEA_ADMIN_USERNAME
              value: {{ .Values.admin.username | quote }}
            - name: GITEA_ADMIN_PASSWORD
              value: {{ .Values.admin.password | quote }}
            - name: GITEA_ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: gitea-data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: {{ .Values.fullnameOverride }}-data

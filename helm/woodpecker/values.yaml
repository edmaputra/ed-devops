# Helm values for Woodpecker CI in local development lab

server:
  enabled: true
  replicaCount: 1

  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-server
    tag: "v3.2.0"
    pullPolicy: IfNotPresent

  env:
    WOODPECKER_HOST: "https://woodpecker.localhost"
    WOODPECKER_SERVER_ADDR: ":8000"
    WOODPECKER_OPEN: "true"
    WOODPECKER_ADMIN: "gitea_admin,admin"
    WOODPECKER_GITEA: "true"
    WOODPECKER_GITEA_URL: "http://gitea-http.default.svc.cluster.local:3000"
    WOODPECKER_EXPERT_FORGE_OAUTH_HOST: "https://gitea.localhost"
    WOODPECKER_GITEA_SKIP_VERIFY: "true"
    WOODPECKER_BACKEND: "kubernetes"
    WOODPECKER_BACKEND_K8S_NAMESPACE: "default"
    WOODPECKER_LOG_LEVEL: "info"

  extraSecretNamesForEnvFrom:
    - "woodpecker-gitea-oauth"

  createAgentSecret: true

  persistentVolume:
    enabled: true
    size: "5Gi"
    storageClass: "local-path"
    mountPath: "/var/lib/woodpecker"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

agent:
  enabled: true
  replicaCount: 1

  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-agent
    tag: "v3.2.0"
    pullPolicy: IfNotPresent

  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: "kubernetes"
    WOODPECKER_BACKEND_K8S_NAMESPACE: "default"
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: "local-path"
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: "10G"
    WOODPECKER_BACKEND_K8S_SERVICE_ACCOUNT: "woodpecker-deployer"
    WOODPECKER_BACKEND_K8S_SERVICE_ACCOUNT_NAME_ALLOW_FROM_STEP: "true"
    WOODPECKER_CONNECT_RETRY_COUNT: "5"
    WOODPECKER_MAX_WORKFLOWS: "2"

  serviceAccount:
    create: true
    name: "woodpecker-agent"
    rbac:
      create: true

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

controller:
  admin:
    username: "admin"
    password: "admin123"
  resources:
    requests:
      cpu: "200m"
      memory: "1024Mi"
    limits:
      cpu: "2000m"
      memory: "2048Mi"
  javaOpts: "-Xmx1536m -Xms512m"
  initContainerResources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2048Mi"
  initContainerEnv:
    - name: JAVA_OPTS
      value: "-Xmx1024m -Xms256m"
  installLatestPlugins: false
persistence:
  enabled: true
  size: "5Gi"

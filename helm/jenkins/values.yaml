controller:
  admin:
    username: "admin"
    password: "admin123"
  jenkinsUrl: "https://jenkins.localhost"
  resources:
    requests:
      cpu: "200m"
      memory: "1024Mi"
    limits:
      cpu: "2000m"
      memory: "2048Mi"
  javaOpts: "-Xmx1536m -Xms512m"
  initContainerResources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2048Mi"
  initContainerEnv:
    - name: JAVA_OPTS
      value: "-Xmx1024m -Xms256m"
  installLatestPlugins: true
  overwritePlugins: true
  additionalPlugins:
    - "pipeline-stage-view:2.41"
    - "junit:latest"
  probes:
    startupProbe:
      failureThreshold: 60
      periodSeconds: 10
      timeoutSeconds: 10
    livenessProbe:
      failureThreshold: 5
      periodSeconds: 10
      timeoutSeconds: 10
    readinessProbe:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 10
  JCasC:
    defaultConfig: true
    configScripts:
      global-build-discarder: |
        unclassified:
          buildDiscarders:
            configuredBuildDiscarders:
              - "jobBuildDiscarder"
              - simpleBuildDiscarder:
                  discarder:
                    logRotator:
                      daysToKeepStr: "2"
                      numToKeepStr: "10"
                      artifactDaysToKeepStr: "2"
                      artifactNumToKeepStr: "5"
persistence:
  enabled: true
  size: "5Gi"
